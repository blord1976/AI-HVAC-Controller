blueprint:
  name: AI HVAC Advisor
  description: >
    Universal AI-powered HVAC optimization for any Home Assistant setup.
    Configure your own comfort rules, seasonal mode logic, and safety limits per zone.
    Uses a conversation agent (Gemini, OpenAI, etc.). Thermostat control needs no helpers.
    Optional: the AI can also pick ceiling-fan speeds (up to two fans per zone) with
    template-enforced limits, room-presence shutoff and manual-change protection.
    Install via HACS (custom_components/ai_hvac) then create one automation per thermostat.
  domain: automation
  author: Brandon Lord
  source_url: https://github.com/blord1976/AI-HVAC-Controller

  input:
    # --- Core entities ---
    thermostat:
      name: Thermostat
      description: Climate entity to control
      selector:
        entity:
          domain: climate

    indoor_temp_sensor:
      name: Indoor Temperature Sensor
      description: Temperature sensor for this zone
      selector:
        entity:
          domain: sensor
          device_class: temperature

    ai_agent:
      name: AI Conversation Agent
      description: Any Home Assistant conversation agent (Settings → Voice assistants)
      selector:
        conversation_agent:

    notification_service:
      name: Notification Service
      description: e.g. notify.mobile_app_phone — used for AUTOMATIC info and MONITORED alerts
      selector:
        text:

    occupancy_sensor:
      name: Home Occupancy
      description: >
        Entity that indicates someone is home when on/home/occupied.
        Examples: person group binary_sensor, input_boolean, device_tracker-derived sensor.
      selector:
        entity:

    # --- Optional sensors ---
    indoor_humidity_sensor:
      name: Indoor Humidity (Optional)
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: humidity

    outdoor_temp_sensor:
      name: Outdoor Temperature (Optional)
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    outdoor_humidity_sensor:
      name: Outdoor Humidity (Optional)
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: humidity

    weather_entity:
      name: Weather Forecast (Optional)
      default: ""
      selector:
        entity:
          domain: weather

    door_sensor:
      name: Door/Window Sensor (Optional)
      default: ""
      selector:
        entity:

    feels_like_sensor:
      name: Feels-Like / Heat Index (Optional)
      description: Used for comfort decisions when provided; otherwise indoor temp is used
      default: ""
      selector:
        entity:
          domain: sensor

    dew_point_sensor:
      name: Dew Point (Optional)
      default: ""
      selector:
        entity:
          domain: sensor

    zone_occupancy_sensor:
      name: Zone Occupancy (Optional)
      description: Per-room occupied sensor; if empty, home occupancy is used for this zone
      default: ""
      selector:
        entity:

    # --- Automation behavior ---
    automation_mode:
      name: Automation Mode
      description: >
        AUTOMATIC executes changes; MONITORED sends Approve/Reject/Override (requires notification
        handler blueprint). Fans are only moved in AUTOMATIC mode; in MONITORED they are logged only.
      default: automatic
      selector:
        select:
          options:
            - label: "OFF — Disabled"
              value: "off"
            - label: "AUTOMATIC — Execute with notification"
              value: "automatic"
            - label: "MONITORED — Approval required"
              value: "monitored"

    zone_name:
      name: Zone Name
      default: "Zone"
      selector:
        text:

    action_id_prefix:
      name: Action ID Prefix
      description: Unique per zone (e.g. LR, UPSTAIRS) — used in notification action IDs
      default: "ZONE"
      selector:
        text:

    temperature_unit:
      name: Temperature Unit Label
      description: Shown in AI prompts and logs (logic uses your threshold numbers as-is)
      default: "°F"
      selector:
        select:
          options:
            - label: "Fahrenheit (°F)"
              value: "°F"
            - label: "Celsius (°C)"
              value: "°C"

    # --- Custom rules (your house, your logic) ---
    custom_rules:
      name: Custom Zone Rules
      description: >
        Free-form rules for the AI. Describe mode preferences, comfort targets, schedule quirks, etc.
        Template-enforced limits below still apply regardless of what the AI suggests.
      default: >
        - Optimize for comfort when home; save energy when away.
        - Prefer maintain when indoor conditions are already comfortable.
        - Use heat or cool when occupied; auto/heat_cool only when away (ECO).
        - Consider forecast and humidity when suggesting changes.
        - Keep explanations to one sentence each for WHY and HOW.
      selector:
        text:
          multiline: true

    # --- Template-enforced mode policy (0 = disabled for thresholds) ---
    unoccupied_hvac_mode:
      name: HVAC Mode When Away (ECO)
      description: Typical value is heat_cool (thermostat auto). Use off to disable HVAC when away.
      default: heat_cool
      selector:
        select:
          options:
            - label: "Auto / heat_cool"
              value: "heat_cool"
            - label: "Heat"
              value: "heat"
            - label: "Cool"
              value: "cool"
            - label: "Off"
              value: "off"

    summer_outdoor_threshold:
      name: Summer Outdoor Threshold
      description: When outdoor temp is ABOVE this, require summer mode. Set 0 to disable.
      default: 0
      selector:
        number:
          min: 0
          max: 120
          step: 1

    summer_required_mode:
      name: Summer Required Mode
      default: cool
      selector:
        select:
          options:
            - label: "Cool"
              value: "cool"
            - label: "Heat"
              value: "heat"
            - label: "Auto / heat_cool"
              value: "heat_cool"

    winter_outdoor_threshold:
      name: Winter Outdoor Threshold
      description: When outdoor temp is BELOW this, require winter mode. Set 0 to disable.
      default: 0
      selector:
        number:
          min: 0
          max: 120
          step: 1

    winter_required_mode:
      name: Winter Required Mode
      default: heat
      selector:
        select:
          options:
            - label: "Heat"
              value: "heat"
            - label: "Cool"
              value: "cool"
            - label: "Auto / heat_cool"
              value: "heat_cool"

    forecast_cool_if_high_above:
      name: Forecast High — Require Cool Above
      description: When today's forecast high exceeds this, require cool mode. 0 = disabled.
      default: 0
      selector:
        number:
          min: 0
          max: 120
          step: 1

    forecast_heat_if_high_below:
      name: Forecast High — Require Heat Below
      description: When today's forecast high is below this, require heat mode. 0 = disabled.
      default: 0
      selector:
        number:
          min: 0
          max: 120
          step: 1

    uncertain_mode:
      name: Mode When No Seasonal Rule Matches
      default: keep_current
      selector:
        select:
          options:
            - label: "Keep current thermostat mode"
              value: "keep_current"
            - label: "Prefer cool"
              value: "cool"
            - label: "Prefer heat"
              value: "heat"
            - label: "Prefer auto / heat_cool"
              value: "heat_cool"

    # --- Night comfort (template enforced) ---
    night_start_hour:
      name: Night Period Start Hour (24h)
      description: Hour when night rules begin (0–23). Set 0 to disable night rules.
      default: 0
      selector:
        number:
          min: 0
          max: 23
          step: 1

    night_end_hour:
      name: Night Period End Hour (24h)
      description: Hour when night rules end. Use when night spans midnight (e.g. start 22, end 6).
      default: 0
      selector:
        number:
          min: 0
          max: 23
          step: 1

    night_min_setpoint:
      name: Night Minimum Setpoint
      description: Floor for target temp during night period. 0 = disabled.
      default: 0
      selector:
        number:
          min: 0
          max: 95
          step: 1

    night_max_setpoint:
      name: Night Maximum Setpoint
      description: Ceiling for target temp during night period. 0 = disabled.
      default: 0
      selector:
        number:
          min: 0
          max: 95
          step: 1

    # --- Comfort skip (skip AI call when already comfortable) ---
    enable_comfort_skip:
      name: Skip AI When Comfortable
      description: When enabled, skip the AI call if feels-like is in band and HVAC is idle
      default: true
      selector:
        boolean:

    comfort_feels_min:
      name: Comfort Band — Minimum Feels-Like
      default: 68
      selector:
        number:
          min: 40
          max: 90
          step: 1

    comfort_feels_max:
      name: Comfort Band — Maximum Feels-Like
      default: 72
      selector:
        number:
          min: 40
          max: 95
          step: 1

    dew_point_high_threshold:
      name: High Dew Point Threshold
      description: Flag high humidity in AI prompt when dew point exceeds this. 0 = disabled.
      default: 65
      selector:
        number:
          min: 0
          max: 90
          step: 1

    # --- ECO ---
    eco_mode_enabled:
      name: ECO Mode When Away
      default: true
      selector:
        boolean:

    eco_cooling_offset:
      name: ECO Cooling Offset
      default: 3
      selector:
        number:
          min: 0
          max: 15
          step: 1

    eco_heating_offset:
      name: ECO Heating Offset
      default: 3
      selector:
        number:
          min: 0
          max: 15
          step: 1

    # --- Safety limits ---
    min_temperature:
      name: Minimum Temperature
      default: 60
      selector:
        number:
          min: 40
          max: 85
          step: 1

    max_temperature:
      name: Maximum Temperature
      default: 85
      selector:
        number:
          min: 55
          max: 95
          step: 1

    max_temp_change:
      name: Maximum Change Per Run
      default: 3
      selector:
        number:
          min: 1
          max: 10
          step: 1

    check_interval_hours:
      name: Check Interval
      description: How often to evaluate this zone
      default: "/1"
      selector:
        select:
          options:
            - label: "Every hour"
              value: "/1"
            - label: "Every 2 hours"
              value: "/2"
            - label: "Every 3 hours"
              value: "/3"
            - label: "Every 4 hours"
              value: "/4"
            - label: "Every 6 hours"
              value: "/6"

    # ============================================================
    # CEILING FANS (optional) — AI recommends speed, templates enforce
    # limits. Leave both fan entities empty to disable all fan logic.
    # ============================================================
    fan_check_minutes:
      name: Fan Check Interval
      description: >
        How often the AI re-evaluates the fans. These are fan-only runs: they never change the
        thermostat. Only used when a fan entity is set below.
      default: "30"
      selector:
        select:
          options:
            - label: "Every 10 minutes"
              value: "10"
            - label: "Every 15 minutes"
              value: "15"
            - label: "Every 20 minutes"
              value: "20"
            - label: "Every 30 minutes"
              value: "30"

    fan_a_entity:
      name: Fan A — Fan
      description: Ceiling fan entity (3-speed or percentage fan). Empty = slot unused.
      default: ""
      selector:
        entity:
          domain: fan

    fan_a_name:
      name: Fan A — Room Name
      default: "Fan A"
      selector:
        text:

    fan_a_presence:
      name: Fan A — Room Presence (Optional)
      description: >
        Motion/occupancy sensor for the fan's room. The fan is turned off when the room is empty.
        If empty, the zone/home occupancy is used.
      default: ""
      selector:
        entity:

    fan_a_temp_sensor:
      name: Fan A — Room Temperature (Optional)
      description: Room-level temperature for the AI. If empty, the zone indoor temperature is used.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    fan_a_last_set_helper:
      name: Fan A — Last-Set Helper (input_text)
      description: >
        input_text helper (max length 30 or more) where the advisor remembers the speed it last set.
        Required for manual-change protection: without it the advisor cannot tell your changes
        (buttons, Pico, other automations) from its own.
      default: ""
      selector:
        entity:
          domain: input_text

    fan_b_entity:
      name: Fan B — Fan
      description: Second ceiling fan entity. Empty = slot unused.
      default: ""
      selector:
        entity:
          domain: fan

    fan_b_name:
      name: Fan B — Room Name
      default: "Fan B"
      selector:
        text:

    fan_b_presence:
      name: Fan B — Room Presence (Optional)
      default: ""
      selector:
        entity:

    fan_b_temp_sensor:
      name: Fan B — Room Temperature (Optional)
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    fan_b_last_set_helper:
      name: Fan B — Last-Set Helper (input_text)
      default: ""
      selector:
        entity:
          domain: input_text

    fan_max_speed:
      name: Fan Maximum Speed (Day)
      description: Highest speed the AI may choose outside the night period.
      default: high
      selector:
        select:
          options:
            - label: "Low"
              value: "low"
            - label: "Medium"
              value: "medium"
            - label: "High"
              value: "high"

    fan_night_max_speed:
      name: Fan Maximum Speed (Night)
      description: Highest speed during the night period (uses the Night Start/End hours above).
      default: low
      selector:
        select:
          options:
            - label: "Low"
              value: "low"
            - label: "Medium"
              value: "medium"
            - label: "High"
              value: "high"

    fan_speed_low_pct:
      name: Fan "Low" Percentage
      default: 33
      selector:
        number:
          min: 1
          max: 100
          step: 1

    fan_speed_medium_pct:
      name: Fan "Medium" Percentage
      default: 66
      selector:
        number:
          min: 1
          max: 100
          step: 1

    fan_speed_high_pct:
      name: Fan "High" Percentage
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1

    fan_change_dwell_minutes:
      name: Fan Minimum Time Between Changes (min)
      description: Prevents speed flapping. Room-empty shutoff and night-cap reductions ignore this.
      default: 15
      selector:
        number:
          min: 0
          max: 120
          step: 1

    fan_manual_override_minutes:
      name: Manual Change Hold (min)
      description: >
        After a fan is changed by anything other than this advisor, the advisor leaves it alone for
        this long. Needs the Last-Set Helper.
      default: 120
      selector:
        number:
          min: 10
          max: 720
          step: 5

    fan_presence_hold_minutes:
      name: Room Presence Hold (min)
      description: >
        A room still counts as occupied this long after its motion sensor clears. At night, a room
        also counts as occupied if its sensor last changed since the evening (sleeping people do not move).
      default: 45
      selector:
        number:
          min: 5
          max: 240
          step: 5

    fan_custom_rules:
      name: Custom Fan Rules
      description: Free-form rules for fan speed. Template-enforced limits (max speed, empty room off) still apply.
      default: >
        - Room warm (room temp above the comfort band): run the fan; use low just above the band,
        medium when clearly warm, high only when well above the band.
        - Room comfortable or cool: off or low. Never high.
        - While the thermostat is heating, prefer off or low.
        - Only change speed when one step is clearly justified; otherwise maintain.
        - Keep bedrooms quiet at night.
      selector:
        text:
          multiline: true

mode: single
max_exceeded: silent

variables:
  zone_name: !input zone_name
  automation_mode: !input automation_mode
  action_id_prefix: !input action_id_prefix
  notification_service: !input notification_service
  thermostat: !input thermostat
  indoor_temp: !input indoor_temp_sensor
  indoor_humidity: !input indoor_humidity_sensor
  outdoor_temp: !input outdoor_temp_sensor
  outdoor_humidity: !input outdoor_humidity_sensor
  weather: !input weather_entity
  occupancy: !input occupancy_sensor
  doors: !input door_sensor
  feels_like: !input feels_like_sensor
  dew_point: !input dew_point_sensor
  zone_occupancy: !input zone_occupancy_sensor
  custom_rules: !input custom_rules
  temp_unit: !input temperature_unit
  unoccupied_mode: !input unoccupied_hvac_mode
  summer_outdoor: !input summer_outdoor_threshold
  summer_mode: !input summer_required_mode
  winter_outdoor: !input winter_outdoor_threshold
  winter_mode: !input winter_required_mode
  forecast_cool_above: !input forecast_cool_if_high_above
  forecast_heat_below: !input forecast_heat_if_high_below
  uncertain_mode: !input uncertain_mode
  night_start: !input night_start_hour
  night_end: !input night_end_hour
  night_min: !input night_min_setpoint
  night_max: !input night_max_setpoint
  comfort_skip: !input enable_comfort_skip
  comfort_min: !input comfort_feels_min
  comfort_max: !input comfort_feels_max
  dew_high: !input dew_point_high_threshold
  eco_enabled: !input eco_mode_enabled
  eco_cooling: !input eco_cooling_offset
  eco_heating: !input eco_heating_offset
  min_temp: !input min_temperature
  max_temp: !input max_temperature
  max_change: !input max_temp_change
  check_hours: !input check_interval_hours
  fan_a: !input fan_a_entity
  fan_a_label: !input fan_a_name
  fan_a_presence: !input fan_a_presence
  fan_a_temp: !input fan_a_temp_sensor
  fan_a_helper: !input fan_a_last_set_helper
  fan_b: !input fan_b_entity
  fan_b_label: !input fan_b_name
  fan_b_presence: !input fan_b_presence
  fan_b_temp: !input fan_b_temp_sensor
  fan_b_helper: !input fan_b_last_set_helper
  fan_max: !input fan_max_speed
  fan_night_max: !input fan_night_max_speed
  fan_low_pct: !input fan_speed_low_pct
  fan_med_pct: !input fan_speed_medium_pct
  fan_high_pct: !input fan_speed_high_pct
  fan_dwell: !input fan_change_dwell_minutes
  fan_override_min: !input fan_manual_override_minutes
  fan_presence_hold: !input fan_presence_hold_minutes
  fan_rules: !input fan_custom_rules

trigger_variables:
  fan_a_trig: !input fan_a_entity
  fan_b_trig: !input fan_b_entity
  fan_every: !input fan_check_minutes

trigger:
  - platform: time_pattern
    hours: !input check_interval_hours
    id: scheduled_check
  # Fan-only check. A template trigger (re-evaluated every minute) so zones with no fan
  # configured never fire it, and offset to minute :01 so it never collides with the hourly run.
  - platform: template
    value_template: >
      {{ (fan_a_trig | string | trim != '' or fan_b_trig | string | trim != '')
         and now().minute % (fan_every | int(30)) == 1 }}
    id: fan_check
  - platform: state
    entity_id: !input occupancy_sensor
    to:
      - "on"
      - "home"
      - "occupied"
    id: occupancy_check

condition:
  - condition: template
    value_template: "{{ automation_mode != 'off' }}"
  # Safety net: fan-only checks do nothing unless at least one fan is configured
  - condition: template
    value_template: "{{ trigger.id != 'fan_check' or fan_a | string | trim != '' or fan_b | string | trim != '' }}"

action:
  - variables:
      context:
        zone: "{{ zone_name }}"
        mode: "{{ automation_mode }}"
        indoor_temp: "{{ states(indoor_temp) | float(70) }}"
        indoor_humidity: >
          {% if indoor_humidity != "" %}{{ states(indoor_humidity) | float(50) }}{% else %}N/A{% endif %}
        thermostat_target: "{{ state_attr(thermostat, 'temperature') | float(70) }}"
        thermostat_mode: "{{ states(thermostat) }}"
        hvac_action: "{{ state_attr(thermostat, 'hvac_action') }}"
        outdoor_temp_val: >
          {% if outdoor_temp != "" %}{{ states(outdoor_temp) | float(70) }}{% else %}N/A{% endif %}
        outdoor_humidity: >
          {% if outdoor_humidity != "" %}{{ states(outdoor_humidity) | float(50) }}{% else %}N/A{% endif %}
        weather_condition: >
          {% if weather != "" %}{{ states(weather) }}{% else %}N/A{% endif %}
        forecast_high: >
          {% if weather != "" and state_attr(weather, 'forecast') %}{{ state_attr(weather, 'forecast')[0].temperature }}{% else %}N/A{% endif %}
        forecast_condition: >
          {% if weather != "" and state_attr(weather, 'forecast') %}{{ state_attr(weather, 'forecast')[0].condition }}{% else %}N/A{% endif %}
        home_occupied: >
          {{ is_state(occupancy, 'on') or is_state(occupancy, 'home') or is_state(occupancy, 'occupied') }}
        eco_mode_active: >
          {{ eco_enabled and not (is_state(occupancy, 'on') or is_state(occupancy, 'home') or is_state(occupancy, 'occupied')) }}
        eco_cooling_value: "{{ eco_cooling }}"
        eco_heating_value: "{{ eco_heating }}"
        doors_open: >
          {% if doors != "" %}{{ is_state(doors, 'on') or is_state(doors, 'open') or (states(doors) | float(0) > 0) }}{% else %}false{% endif %}
        min_allowed: "{{ min_temp }}"
        max_allowed: "{{ max_temp }}"
        max_change_allowed: "{{ max_change }}"
        feels_like_temp: >
          {% if feels_like != "" %}{{ states(feels_like) | float(states(indoor_temp) | float(70)) }}{% else %}{{ states(indoor_temp) | float(70) }}{% endif %}
        dew_point_f: >
          {% if dew_point != "" %}{{ states(dew_point) | float(50) }}{% else %}N/A{% endif %}
        zone_occupied: >
          {% if zone_occupancy != "" %}{{ is_state(zone_occupancy, 'on') or is_state(zone_occupancy, 'home') or is_state(zone_occupancy, 'occupied') }}{% else %}{{ is_state(occupancy, 'on') or is_state(occupancy, 'home') or is_state(occupancy, 'occupied') }}{% endif %}
        supported_hvac_modes: "{{ state_attr(thermostat, 'hvac_modes') | join(', ') }}"

  - variables:
      policy:
        home_occupied: "{{ context.home_occupied }}"
        eco_active: "{{ context.eco_mode_active }}"
        is_night: >
          {% set h = now().hour %}
          {% set ns = night_start | int %}
          {% set ne = night_end | int %}
          {% if ns == 0 %}false
          {% elif ne > 0 and ns > ne %}{{ h >= ns or h < ne }}
          {% else %}{{ h >= ns }}{% endif %}
        required_mode: >
          {% if context.eco_mode_active %}{{ unoccupied_mode }}
          {% elif summer_outdoor | int > 0 and outdoor_temp != "" and states(outdoor_temp) | float(999) > summer_outdoor | int %}{{ summer_mode }}
          {% elif winter_outdoor | int > 0 and outdoor_temp != "" and states(outdoor_temp) | float(-999) < winter_outdoor | int %}{{ winter_mode }}
          {% elif forecast_cool_above | int > 0 and weather != "" and state_attr(weather, 'forecast') and state_attr(weather, 'forecast')[0].temperature | float(0) > forecast_cool_above | int %}cool
          {% elif forecast_heat_below | int > 0 and weather != "" and state_attr(weather, 'forecast') and state_attr(weather, 'forecast')[0].temperature | float(999) < forecast_heat_below | int %}heat
          {% elif uncertain_mode == 'cool' %}cool
          {% elif uncertain_mode == 'heat' %}heat
          {% elif uncertain_mode == 'heat_cool' %}heat_cool
          {% else %}{{ states(thermostat) }}{% endif %}
        eff_min_temp: >
          {% set base = min_temp | float %}
          {% set ns = night_start | int %}
          {% set h = now().hour %}
          {% set ne = night_end | int %}
          {% set night = ns > 0 and ((ne > 0 and ns > ne and (h >= ns or h < ne)) or (ne == 0 and h >= ns) or (ne > ns and h >= ns and h < ne)) %}
          {% if night and night_min | int > 0 %}{{ [base, night_min | float] | max }}{% else %}{{ base }}{% endif %}
        eff_max_temp: >
          {% set base = max_temp | float %}
          {% set ns = night_start | int %}
          {% set h = now().hour %}
          {% set ne = night_end | int %}
          {% set night = ns > 0 and ((ne > 0 and ns > ne and (h >= ns or h < ne)) or (ne == 0 and h >= ns) or (ne > ns and h >= ns and h < ne)) %}
          {% if night and night_max | int > 0 %}{{ [base, night_max | float] | min }}{% else %}{{ base }}{% endif %}
        skip_ai: >
          {% if trigger.id == 'fan_check' %}false
          {% elif not comfort_skip %}false
          {% elif context.eco_mode_active %}false
          {% elif state_attr(thermostat, 'hvac_action') != 'idle' %}false
          {% elif context.feels_like_temp | float(0) < comfort_min | float %}false
          {% elif context.feels_like_temp | float(999) > comfort_max | float %}false
          {% else %}true{% endif %}
        high_humidity: >
          {{ dew_high | int > 0 and context.dew_point_f != 'N/A' and (context.dew_point_f | float(0)) > dew_high | int }}

  # ---- Fan state snapshot (before the AI call) ----
  # One entry per configured fan: current speed label, whether its room is occupied,
  # whether someone changed it manually, and the highest speed allowed right now.
  - variables:
      fans_raw: >
        {% set slots = [
          {'id': 'A', 'entity': fan_a, 'name': fan_a_label, 'presence': fan_a_presence, 'temp': fan_a_temp, 'helper': fan_a_helper},
          {'id': 'B', 'entity': fan_b, 'name': fan_b_label, 'presence': fan_b_presence, 'temp': fan_b_temp, 'helper': fan_b_helper}
        ] %}
        {% set lo = fan_low_pct | float(33) %}
        {% set md = fan_med_pct | float(66) %}
        {% set hi = fan_high_pct | float(100) %}
        {% set night = policy.is_night | string | trim | lower == 'true' %}
        {% set cap = fan_night_max if night else fan_max %}
        {% set now_ts = as_timestamp(now()) %}
        {% set ns = namespace(out=[]) %}
        {% for s in slots if s.entity | string | trim != '' %}
          {% set st = states(s.entity) %}
          {% set obj = states[s.entity] %}
          {% set pct = state_attr(s.entity, 'percentage') | float(0) %}
          {% if st in ['unavailable', 'unknown'] %}{% set label = 'unavailable' %}
          {% elif st != 'on' or pct <= 0 %}{% set label = 'off' %}
          {% elif pct <= (lo + md) / 2 %}{% set label = 'low' %}
          {% elif pct <= (md + hi) / 2 %}{% set label = 'medium' %}
          {% else %}{% set label = 'high' %}{% endif %}
          {% set age_min = ((now_ts - as_timestamp(obj.last_updated)) / 60) if obj is not none else 9999 %}
          {% set hv = states(s.helper) if s.helper | string | trim != '' else '' %}
          {% set set_label = hv.split('|')[0] if '|' in hv else '' %}
          {% set override = s.helper | string | trim != '' and set_label != '' and label != 'unavailable' and label != set_label and age_min < (fan_override_min | float(120)) %}
          {% if s.presence | string | trim != '' %}
            {% set pobj = states[s.presence] %}
            {% set on_now = states(s.presence) in ['on', 'home', 'occupied'] %}
            {% set held = pobj is not none and (now_ts - as_timestamp(pobj.last_changed)) < (fan_presence_hold | float(45)) * 60 %}
            {% set ns_h = night_start | int %}
            {% set begin = today_at('%02d:00' % ns_h) if now().hour >= ns_h else today_at('%02d:00' % ns_h) - timedelta(days=1) %}
            {% set held_night = night and pobj is not none and as_timestamp(pobj.last_changed) >= as_timestamp(begin) - 3600 %}
            {% set room_occ = on_now or held or held_night %}
          {% else %}
            {% set room_occ = context.zone_occupied | string | trim | lower == 'true' %}
          {% endif %}
          {% set room_temp = (states(s.temp) | float(context.indoor_temp | float(70))) if s.temp | string | trim != '' else context.indoor_temp | float(70) %}
          {% set ns.out = ns.out + [{
            'id': s.id, 'name': s.name, 'entity': s.entity, 'helper': s.helper,
            'label': label, 'occupied': 1 if room_occ else 0, 'override': 1 if override else 0,
            'cap': cap, 'age_min': age_min | round(1), 'room_temp': room_temp | round(1)
          }] %}
        {% endfor %}
        {{ ns.out | tojson }}

  - variables:
      fans: "{{ fans_raw if fans_raw is not string else fans_raw | from_json }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ policy.skip_ai }}"
        sequence:
          - service: logbook.log
            data:
              name: "AI HVAC ({{ zone_name }})"
              message: >
                Skip AI — feels-like {{ context.feels_like_temp }}{{ temp_unit }} in comfort band,
                HVAC idle, required mode {{ policy.required_mode }}
          - stop: "Comfort band — skip AI"

  - service: conversation.process
    data:
      text: |
        You are an expert HVAC optimization system. Analyze conditions and provide ONE recommendation.

        ZONE: {{ context.zone }}
        AUTOMATION: {{ context.mode | upper }}

        INDOOR:
        - Dry-bulb: {{ context.indoor_temp }}{{ temp_unit }} (target: {{ context.thermostat_target }}{{ temp_unit }})
        - Feels-like: {{ context.feels_like_temp }}{{ temp_unit }}
        {% if context.dew_point_f != "N/A" -%}- Dew point: {{ context.dew_point_f }}{{ temp_unit }}{% if policy.high_humidity %} (HIGH humidity){% endif %}{% endif %}
        {% if context.indoor_humidity != "N/A" -%}- Humidity: {{ context.indoor_humidity }}%{% endif %}
        - Mode: {{ context.thermostat_mode }} | Supported: {{ context.supported_hvac_modes }}
        - Action: {{ context.hvac_action }}
        - Zone occupied: {% if context.zone_occupied %}YES{% else %}NO{% endif %}

        OUTDOOR:
        {% if context.outdoor_temp_val != "N/A" -%}- Temp: {{ context.outdoor_temp_val }}{{ temp_unit }}{% endif %}
        {% if context.weather_condition != "N/A" -%}- Weather: {{ context.weather_condition }}{% endif %}
        {% if context.forecast_high != "N/A" -%}- Forecast high: {{ context.forecast_high }}{{ temp_unit }}{% endif %}

        STATUS:
        - Home: {% if policy.home_occupied %}OCCUPIED{% else %}AWAY{% endif %}
        - ECO: {% if context.eco_mode_active %}ACTIVE{% else %}inactive{% endif %}
        - Doors: {% if context.doors_open %}OPEN{% else %}closed{% endif %}

        {% if context.eco_mode_active -%}
        ECO (away): allow mode {{ unoccupied_mode }}; cooling target +{{ context.eco_cooling_value }}{{ temp_unit }}, heating target -{{ context.eco_heating_value }}{{ temp_unit }}.
        {% endif -%}

        HARD LIMITS (already enforced in templates — do not violate):
        - Required mode now: {{ policy.required_mode }}
        - Setpoint range this run: {{ policy.eff_min_temp }}–{{ policy.eff_max_temp }}{{ temp_unit }}
        - Max change: ±{{ context.max_change_allowed }}{{ temp_unit }} from current target
        - Doors open → recommend turn_off

        CUSTOM RULES FOR THIS ZONE:
        {{ custom_rules }}

        {% if fans | length > 0 -%}
        CEILING FANS (you recommend a speed for each; limits are enforced in templates):
        Comfort band (feels-like): {{ comfort_min }}–{{ comfort_max }}{{ temp_unit }}
        {% for f in fans -%}
        - FAN_{{ f.id }} "{{ f.name }}": now {{ f.label }}; room temp {{ f.room_temp }}{{ temp_unit }}; room {% if f.occupied == 1 %}occupied{% else %}EMPTY (it will be turned off){% endif %}{% if f.override == 1 %}; MANUALLY SET (answer maintain){% endif %}; highest allowed speed {{ f.cap }}
        {% endfor -%}
        Speeds: off, low, medium, high, or maintain (leave as is).
        FAN RULES:
        {{ fan_rules }}

        {% endif -%}
        {% if trigger.id == 'fan_check' -%}
        THIS IS A FAN-ONLY CHECK. Do not recommend thermostat changes: answer ACTION: maintain, TARGET_TEMP: N/A, TARGET_MODE: N/A.

        {% endif -%}
        RESPONSE FORMAT (exactly):
        ACTION: [maintain|adjust_temp|change_mode|turn_off]
        TARGET_TEMP: [number or N/A]
        TARGET_MODE: [heat|cool|heat_cool|off or N/A]
        WHY: [one sentence]
        HOW: [one sentence]
        CONFIDENCE: [0-100]
        {% for f in fans -%}
        FAN_{{ f.id }}: [off|low|medium|high|maintain]
        {% endfor -%}
        {% if fans | length > 0 -%}
        FAN_NOTE: [one sentence on the fan decisions]
        {% endif %}
      agent_id: !input ai_agent
    response_variable: ai_response

  - variables:
      ai_text: "{{ ai_response.response.speech.plain.speech }}"
      parsed:
        action: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'ACTION:' in line %}{{ line.split('ACTION:')[1].strip().split(' ')[0] }}{% endif %}{% endfor %}
        temp: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'TARGET_TEMP:' in line %}{{ line.split('TARGET_TEMP:')[1].strip().replace('N/A', '') }}{% endif %}{% endfor %}
        mode: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'TARGET_MODE:' in line %}{{ line.split('TARGET_MODE:')[1].strip().replace('N/A', '') }}{% endif %}{% endfor %}
        why: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'WHY:' in line %}{{ line.split('WHY:')[1].strip() }}{% endif %}{% endfor %}
        how: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'HOW:' in line %}{{ line.split('HOW:')[1].strip() }}{% endif %}{% endfor %}
        confidence: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'CONFIDENCE:' in line %}{{ line.split('CONFIDENCE:')[1].strip() }}{% endif %}{% endfor %}
        fan_a: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'FAN_A:' in line %}{{ line.split('FAN_A:')[1].strip().split(' ')[0] }}{% endif %}{% endfor %}
        fan_b: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'FAN_B:' in line %}{{ line.split('FAN_B:')[1].strip().split(' ')[0] }}{% endif %}{% endfor %}
        fan_note: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'FAN_NOTE:' in line %}{{ line.split('FAN_NOTE:')[1].strip() }}{% endif %}{% endfor %}

  - variables:
      safe:
        action: >
          {% if parsed.action not in ['maintain', 'adjust_temp', 'change_mode', 'turn_off'] %}maintain{% else %}{{ parsed.action }}{% endif %}
        mode: >
          {% if policy.eco_active %}{{ unoccupied_mode }}
          {% elif parsed.action == 'change_mode' and parsed.mode in ['heat', 'cool', 'heat_cool', 'off'] %}{{ parsed.mode }}
          {% elif parsed.action in ['adjust_temp', 'change_mode'] %}{{ policy.required_mode }}
          {% elif parsed.mode in ['heat', 'cool', 'heat_cool', 'off'] %}{{ parsed.mode }}
          {% else %}{{ policy.required_mode }}{% endif %}
        temp: >
          {% set raw = parsed.temp | default('') | trim %}
          {% set t = raw | float(context.thermostat_target) if raw not in ['', 'N/A'] else context.thermostat_target | float %}
          {% set lo = policy.eff_min_temp | float %}
          {% set hi = policy.eff_max_temp | float %}
          {% set cur = context.thermostat_target | float %}
          {% set max_delta = context.max_change_allowed | float %}
          {% set t = [[t, hi] | min, lo] | max %}
          {% set t = [[t, cur + max_delta] | min, [cur - max_delta, lo] | max] | max %}
          {{ t }}
        why: "{{ parsed.why | default('') }}"
        how: "{{ parsed.how | default('') }}"
        confidence: "{{ parsed.confidence | default('') }}"

  # ---- Fan decisions: AI proposal passed through hard limits ----
  # Order of precedence: unavailable > manual change > empty room (off) > AI speed
  # clamped to the day/night maximum > minimum dwell between changes.
  - variables:
      fan_actions_raw: >
        {% set rank = {'off': 0, 'low': 1, 'medium': 2, 'high': 3} %}
        {% set pcts = {'off': 0, 'low': fan_low_pct | float(33), 'medium': fan_med_pct | float(66), 'high': fan_high_pct | float(100)} %}
        {% set ai = {'A': parsed.fan_a | string | trim | lower, 'B': parsed.fan_b | string | trim | lower} %}
        {% set ns = namespace(out=[]) %}
        {% for f in fans %}
          {% set want = ai.get(f.id, 'maintain') %}
          {% if want not in ['off', 'low', 'medium', 'high', 'maintain'] %}{% set want = 'maintain' %}{% endif %}
          {% set cur = f.label %}
          {% set action = 'none' %}
          {% set tgt = cur %}
          {% set reason = '' %}
          {% if cur == 'unavailable' %}
            {% set reason = 'hold: fan unavailable' %}
          {% elif f.override | int(0) == 1 %}
            {% set reason = 'hold: manual change detected' %}
          {% elif f.occupied | int(0) == 0 %}
            {% if cur != 'off' %}{% set action = 'set' %}{% set tgt = 'off' %}{% set reason = 'room empty' %}{% endif %}
          {% else %}
            {% set base = cur if want == 'maintain' else want %}
            {% set tgt = base if rank[base] <= rank[f.cap] else f.cap %}
            {% set forced = rank[cur] > rank[f.cap] %}
            {% if tgt != cur %}
              {% if f.age_min | float(9999) < fan_dwell | float(15) and not forced %}
                {% set tgt = cur %}{% set reason = 'hold: changed recently' %}
              {% else %}
                {% set action = 'set' %}{% set reason = 'speed cap' if forced else 'AI' %}
              {% endif %}
            {% endif %}
          {% endif %}
          {% set ns.out = ns.out + [{
            'id': f.id, 'name': f.name, 'entity': f.entity, 'helper': f.helper,
            'prev': cur, 'to': tgt, 'action': action, 'pct': pcts.get(tgt, 0), 'reason': reason
          }] %}
        {% endfor %}
        {{ ns.out | tojson }}

  - variables:
      fan_actions: "{{ fan_actions_raw if fan_actions_raw is not string else fan_actions_raw | from_json }}"

  - variables:
      fan_log: >
        {% set ns = namespace(parts=[]) %}
        {% for a in fan_actions %}
          {% if a.action == 'set' or a.reason.startswith('hold') %}
            {% set ns.parts = ns.parts + [a.name ~ ': ' ~ a.prev ~ ' → ' ~ a.to ~ ' (' ~ a.reason ~ ')'] %}
          {% endif %}
        {% endfor %}
        {{ ns.parts | join(' | ') }}{% if ns.parts | length > 0 and parsed.fan_note | trim != '' %} — {{ parsed.fan_note | trim }}{% endif %}

  # Thermostat summary log (skipped on fan-only checks)
  - if:
      - condition: template
        value_template: "{{ trigger.id != 'fan_check' }}"
    then:
      - service: logbook.log
        data:
          name: "AI HVAC ({{ zone_name }})"
          message: >
            {% if safe.action == 'maintain' %}No change — conditions OK
            {% else %}Suggest {{ safe.action }} → {{ safe.temp }}{{ temp_unit }} {{ safe.mode }} | {{ safe.why }}{% if context.eco_mode_active %} | ECO{% endif %}{% endif %}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ safe.action == 'maintain' or trigger.id == 'fan_check' }}"
        sequence: []

      - conditions:
          - condition: template
            value_template: "{{ automation_mode == 'monitored' and safe.action != 'maintain' }}"
        sequence:
          - service: "{{ notification_service }}"
            data:
              title: "AI HVAC — {{ zone_name }}"
              message: >
                {{ safe.action | upper }}: {{ safe.temp }}{{ temp_unit }} {{ safe.mode }}
                Why: {{ safe.why }}
              data:
                ai_hvac_thermostat: "{{ thermostat }}"
                ai_hvac_action: "{{ safe.action }}"
                ai_hvac_temp: "{{ safe.temp }}"
                ai_hvac_mode: "{{ safe.mode }}"
                ai_hvac_zone: "{{ action_id_prefix }}"
                tag: "ai_hvac_{{ action_id_prefix | lower }}"
                actions:
                  - action: "APPROVE_{{ action_id_prefix }}_HVAC"
                    title: "Approve"
                  - action: "REJECT_{{ action_id_prefix }}_HVAC"
                    title: "Reject"
                  - action: "OVERRIDE_{{ action_id_prefix }}_HVAC"
                    title: "Override"
                    behavior: "textInput"
                    textInputButtonTitle: "Send"
                    textInputPlaceholder: "e.g. set to 72"

      - conditions:
          - condition: template
            value_template: "{{ automation_mode == 'automatic' and safe.action != 'maintain' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ safe.action == 'adjust_temp' }}"
                sequence:
                  - service: climate.set_temperature
                    target:
                      entity_id: "{{ thermostat }}"
                    data:
                      temperature: "{{ safe.temp | float }}"
              - conditions:
                  - condition: template
                    value_template: "{{ safe.action == 'change_mode' }}"
                sequence:
                  - service: climate.set_hvac_mode
                    target:
                      entity_id: "{{ thermostat }}"
                    data:
                      hvac_mode: "{{ safe.mode }}"
              - conditions:
                  - condition: template
                    value_template: "{{ safe.action == 'turn_off' }}"
                sequence:
                  - service: climate.turn_off
                    target:
                      entity_id: "{{ thermostat }}"
          - service: "{{ notification_service }}"
            data:
              title: "AI HVAC — {{ zone_name }}"
              message: "Auto: {{ safe.action }} → {{ safe.temp }}{{ temp_unit }} {{ safe.mode }}. {{ safe.why }}"
              data:
                tag: "ai_hvac_{{ action_id_prefix | lower }}"
          - service: logbook.log
            data:
              name: "AI HVAC ({{ zone_name }})"
              message: "Executed {{ safe.action }} → {{ safe.temp }}{{ temp_unit }} {{ safe.mode }}"

  # ---- Apply fan changes (AUTOMATIC mode only; always logged) ----
  - if:
      - condition: template
        value_template: "{{ fan_log | trim != '' }}"
    then:
      - service: logbook.log
        data:
          name: "AI HVAC ({{ zone_name }}) fans"
          message: "{{ fan_log | trim }}{% if automation_mode != 'automatic' %} [not applied: {{ automation_mode }} mode]{% endif %}"
  - if:
      - condition: template
        value_template: "{{ automation_mode == 'automatic' and fan_actions | length > 0 }}"
    then:
      - repeat:
          for_each: "{{ fan_actions }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.item.action == 'set' }}"
              then:
                - if:
                    - condition: template
                      value_template: "{{ repeat.item.to == 'off' }}"
                  then:
                    - service: fan.turn_off
                      target:
                        entity_id: "{{ repeat.item.entity }}"
                  else:
                    - service: fan.turn_on
                      target:
                        entity_id: "{{ repeat.item.entity }}"
                      data:
                        percentage: "{{ repeat.item.pct | int }}"
                # Remember what we set so a later difference is recognised as a manual change
                - if:
                    - condition: template
                      value_template: "{{ repeat.item.helper | string | trim != '' }}"
                  then:
                    - service: input_text.set_value
                      target:
                        entity_id: "{{ repeat.item.helper }}"
                      data:
                        value: "{{ repeat.item.to }}|{{ as_timestamp(now()) | int }}"
