blueprint:
  name: AI HVAC Advisor
  description: >
    AI-powered HVAC optimization with Gemini AI, occupancy-based ECO mode, and three automation modes:
    OFF (disabled), MONITORED (approval required), AUTOMATIC (executes with notifications only).
    Deploy once per thermostat - create multiple automations from this blueprint for multi-zone control.
  domain: automation
  author: Brandon Lord
  source_url: https://github.com/blord1976/ai-hvac-blueprint
  
  input:
    # =============================================================================
    # CORE ENTITIES - Required for all modes
    # =============================================================================
    
    thermostat:
      name: Thermostat
      description: Climate entity to control
      selector:
        entity:
          domain: climate
    
    indoor_temp_sensor:
      name: Indoor Temperature Sensor  
      description: Temperature sensor for this zone
      selector:
        entity:
          domain: sensor
          device_class: temperature
    
    ai_agent:
      name: AI Conversation Agent
      description: Gemini AI or compatible conversation agent
      selector:
        conversation_agent:
    
    notification_service:
      name: Notification Service
      description: Mobile app notification service (e.g., notify.mobile_app_your_phone)
      selector:
        text:
    
    occupancy_sensor:
      name: Home Occupancy
      description: >
        Home occupied/away signal (e.g. input_boolean.anyone_home or binary_sensor.anyone_home_occupancy).
        Occupied = "on". Used for ECO when off/unoccupied.
      selector:
        entity:
          domain:
            - binary_sensor
            - input_boolean
    
    # =============================================================================
    # OPTIONAL SENSORS - Improve AI accuracy
    # =============================================================================
    
    indoor_humidity_sensor:
      name: Indoor Humidity Sensor (Optional)
      description: Humidity sensor for better comfort optimization
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: humidity
    
    outdoor_temp_sensor:
      name: Outdoor Temperature Sensor (Optional)
      description: Outdoor temperature for better predictions
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature
    
    outdoor_humidity_sensor:
      name: Outdoor Humidity Sensor (Optional)
      description: Outdoor humidity sensor
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: humidity
    
    weather_entity:
      name: Weather Forecast (Optional)
      description: Weather entity for forecast-aware optimization
      default: ""
      selector:
        entity:
          domain: weather
    
    door_sensor:
      name: Door/Window Sensor (Optional)
      description: Sensor showing number of open doors/windows (or binary sensor)
      default: ""
      selector:
        entity:

    feels_like_sensor:
      name: Feels-Like / Heat Index Sensor (Optional)
      description: e.g. sensor.lr_thermal_comfort_heat_index — used instead of dry-bulb temp for comfort rules
      default: ""
      selector:
        entity:
          domain: sensor

    dew_point_sensor:
      name: Dew Point Sensor (Optional)
      description: e.g. sensor.lr_thermal_comfort_dew_point — high humidity prioritization
      default: ""
      selector:
        entity:
          domain: sensor

    zone_occupancy_sensor:
      name: Zone Occupancy Sensor (Optional)
      description: >
        Per-zone occupied (e.g. binary_sensor.upstairs_occupancy_status). If empty, home occupancy is used.
      default: ""
      selector:
        entity:
          domain:
            - binary_sensor
            - input_boolean

    zone_policy:
      name: Zone Policy Profile
      description: Pre-defined rule set for Living Room vs Upstairs (enforced in templates + prompt)
      default: living_room
      selector:
        select:
          options:
            - label: "Living Room"
              value: "living_room"
            - label: "Upstairs"
              value: "upstairs"
    
    # =============================================================================
    # AUTOMATION MODE - Control behavior
    # =============================================================================
    
    automation_mode:
      name: Automation Mode
      description: >
        OFF: Disabled (no analysis or actions).
        MONITORED: AI suggests changes, you approve via notification buttons (safest).
        AUTOMATIC: AI executes changes automatically with notification (advanced users only).
      default: automatic
      selector:
        select:
          options:
            - label: "OFF - Disabled"
              value: "off"
            - label: "MONITORED - Approval Required (Recommended)"
              value: "monitored"
            - label: "AUTOMATIC - Auto-Execute with Notifications"
              value: "automatic"
    
    # =============================================================================
    # ZONE CONFIGURATION
    # =============================================================================
    
    zone_name:
      name: Zone Name
      description: Display name for this zone (e.g., "Living Room", "Master Bedroom")
      default: "Zone"
      selector:
        text:
    
    action_id_prefix:
      name: Action ID Prefix
      description: >
        Unique prefix for notification actions (e.g., "LR", "MASTER", "UPSTAIRS").
        Must be different for each zone! This creates action IDs like APPROVE_LR_HVAC.
      default: "ZONE"
      selector:
        text:
    
    # =============================================================================
    # ECO MODE SETTINGS
    # =============================================================================
    
    eco_mode_enabled:
      name: ECO Mode Enabled
      description: Enable automatic temperature setbacks when home is unoccupied
      default: true
      selector:
        boolean:
    
    eco_cooling_offset:
      name: ECO Cooling Offset (°F)
      description: How many degrees warmer when away and cooling (default 5°F)
      default: 5
      selector:
        number:
          min: 0
          max: 15
          step: 1
          unit_of_measurement: "°F"
    
    eco_heating_offset:
      name: ECO Heating Offset (°F)
      description: How many degrees cooler when away and heating (default 5°F)
      default: 5
      selector:
        number:
          min: 0
          max: 15
          step: 1
          unit_of_measurement: "°F"
    
    # =============================================================================
    # SAFETY LIMITS
    # =============================================================================
    
    min_temperature:
      name: Minimum Temperature
      description: Absolute minimum allowed temperature
      default: 60
      selector:
        number:
          min: 50
          max: 75
          step: 1
          unit_of_measurement: "°F"
    
    max_temperature:
      name: Maximum Temperature  
      description: Absolute maximum allowed temperature
      default: 85
      selector:
        number:
          min: 70
          max: 95
          step: 1
          unit_of_measurement: "°F"
    
    max_temp_change:
      name: Maximum Temperature Change
      description: Maximum temperature change per suggestion
      default: 4
      selector:
        number:
          min: 1
          max: 10
          step: 1
          unit_of_measurement: "°F"

mode: single
max_exceeded: silent

variables:
  zone_name: !input zone_name
  automation_mode: !input automation_mode
  action_id_prefix: !input action_id_prefix
  notification_service: !input notification_service
  thermostat: !input thermostat
  indoor_temp: !input indoor_temp_sensor
  indoor_humidity: !input indoor_humidity_sensor
  outdoor_temp: !input outdoor_temp_sensor
  outdoor_humidity: !input outdoor_humidity_sensor
  weather: !input weather_entity
  occupancy: !input occupancy_sensor
  doors: !input door_sensor
  feels_like: !input feels_like_sensor
  dew_point: !input dew_point_sensor
  zone_occupancy: !input zone_occupancy_sensor
  zone_policy: !input zone_policy
  eco_enabled: !input eco_mode_enabled
  eco_cooling: !input eco_cooling_offset
  eco_heating: !input eco_heating_offset
  min_temp: !input min_temperature
  max_temp: !input max_temperature
  max_change: !input max_temp_change

trigger:
  - platform: time_pattern
    hours: "/1"
    id: "scheduled_check"

condition:
  # Only run if mode is not OFF
  - condition: template
    value_template: "{{ automation_mode != 'off' }}"

action:
  # Step 1: Gather complete context
  - variables:
      context:
        timestamp: "{{ now().isoformat() }}"
        zone: "{{ zone_name }}"
        mode: "{{ automation_mode }}"
        
        # Indoor conditions
        indoor_temp: "{{ states(indoor_temp) | float(70) }}"
        indoor_humidity: >
          {% if indoor_humidity != "" %}{{ states(indoor_humidity) | float(50) }}{% else %}N/A{% endif %}
        thermostat_target: "{{ state_attr(thermostat, 'temperature') | float(70) }}"
        thermostat_mode: "{{ states(thermostat) }}"
        hvac_action: "{{ state_attr(thermostat, 'hvac_action') }}"
        
        # Outdoor conditions
        outdoor_temp: >
          {% if outdoor_temp != "" %}{{ states(outdoor_temp) | float(70) }}{% else %}N/A{% endif %}
        outdoor_humidity: >
          {% if outdoor_humidity != "" %}{{ states(outdoor_humidity) | float(50) }}{% else %}N/A{% endif %}
        
        # Weather
        weather_condition: >
          {% if weather != "" %}{{ states(weather) }}{% else %}N/A{% endif %}
        forecast_high: >
          {% if weather != "" and state_attr(weather, 'forecast') %}{{ state_attr(weather, 'forecast')[0].temperature }}{% else %}N/A{% endif %}
        forecast_condition: >
          {% if weather != "" and state_attr(weather, 'forecast') %}{{ state_attr(weather, 'forecast')[0].condition }}{% else %}N/A{% endif %}
        
        # Occupancy & ECO
        home_occupied: "{{ is_state(occupancy, 'on') }}"
        eco_mode_active: "{{ eco_enabled and not is_state(occupancy, 'on') }}"
        eco_cooling_value: "{{ eco_cooling }}"
        eco_heating_value: "{{ eco_heating }}"
        
        # Doors
        doors_open: >
          {% if doors != "" %}{{ states(doors) != '0' and states(doors) != 'unknown' and states(doors) != 'closed' }}{% else %}false{% endif %}
        
        # Limits
        min_allowed: "{{ min_temp }}"
        max_allowed: "{{ max_temp }}"
        max_change_allowed: "{{ max_change }}"

        feels_like_temp: >
          {% if feels_like != "" %}{{ states(feels_like) | float(states(indoor_temp) | float(70)) }}{% else %}{{ states(indoor_temp) | float(70) }}{% endif %}
        dew_point_f: >
          {% if dew_point != "" %}{{ states(dew_point) | float(50) }}{% else %}N/A{% endif %}
        zone_occupied: >
          {% if zone_occupancy != "" %}{{ is_state(zone_occupancy, 'on') }}{% else %}{{ is_state(occupancy, 'on') }}{% endif %}
        supported_hvac_modes: "{{ state_attr(thermostat, 'hvac_modes') | join(', ') }}"

  # Step 1b: Compute enforced policy (templates — not prompt-only)
  - variables:
      policy:
        home_occupied: "{{ is_state(occupancy, 'on') }}"
        eco_active: "{{ eco_enabled and not is_state(occupancy, 'on') }}"
        hour: "{{ now().hour }}"
        outdoor_f: >
          {% if outdoor_temp != "" %}{{ states(outdoor_temp) | float(70) }}{% else %}70{% endif %}
        forecast_high_f: >
          {% if weather != "" and state_attr(weather, 'forecast') %}{{ state_attr(weather, 'forecast')[0].temperature | float(70) }}{% else %}70{% endif %}
        feels_f: "{{ context.feels_like_temp | float(70) }}"
        is_night: >
          {{ (zone_policy == 'living_room' and now().hour >= 23) or (zone_policy == 'upstairs' and now().hour >= 22) }}
        is_weekend: "{{ now().weekday() in [5, 6] }}"
        required_mode: >
          {% if eco_enabled and not is_state(occupancy, 'on') -%}
          heat_cool
          {%- elif zone_policy == 'living_room' -%}
          {%- if outdoor_temp != "" and states(outdoor_temp) | float(70) > 75 -%}cool
          {%- elif outdoor_temp != "" and states(outdoor_temp) | float(70) < 55 -%}heat
          {%- elif weather != "" and state_attr(weather, 'forecast') and state_attr(weather, 'forecast')[0].temperature | float(70) > 70 -%}cool
          {%- elif weather != "" and state_attr(weather, 'forecast') and state_attr(weather, 'forecast')[0].temperature | float(70) < 60 -%}heat
          {%- else -%}{{ states(thermostat) }}{%- endif -%}
          {%- elif zone_policy == 'upstairs' -%}
          {%- if outdoor_temp != "" and states(outdoor_temp) | float(70) > 65 -%}cool
          {%- elif outdoor_temp != "" and states(outdoor_temp) | float(70) < 50 -%}heat
          {%- elif weather != "" and state_attr(weather, 'forecast') and state_attr(weather, 'forecast')[0].temperature | float(70) > 65 -%}cool
          {%- elif weather != "" and state_attr(weather, 'forecast') and state_attr(weather, 'forecast')[0].temperature | float(70) < 50 -%}heat
          {%- else -%}cool{%- endif -%}
          {%- else -%}{{ states(thermostat) }}{%- endif -%}
        eff_min_temp: >
          {% set base = min_temp | float %}
          {% if zone_policy == 'living_room' and now().hour >= 23 %}{{ [base, 74] | max }}{% else %}{{ base }}{% endif %}
        eff_max_temp: >
          {% set base = max_temp | float %}
          {% if zone_policy == 'upstairs' and now().hour >= 22 %}{{ [base, 71] | min }}{% else %}{{ base }}{% endif %}
        skip_ai: >
          {% set eco_on = eco_enabled and not is_state(occupancy, 'on') %}
          {% set feels = context.feels_like_temp | float(70) %}
          {% set feels_max = 74 if zone_policy == 'upstairs' else 72 %}
          {{ not eco_on
             and state_attr(thermostat, 'hvac_action') == 'idle'
             and feels >= 68
             and feels <= feels_max }}
        high_humidity: >
          {{ context.dew_point_f != 'N/A' and (context.dew_point_f | float(0)) > 65 }}

  # Step 1c: Skip AI when comfortable and idle (saves drift + API calls)
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ policy.skip_ai }}"
        sequence:
          - service: logbook.log
            data:
              name: "AI HVAC ({{ zone_name }})"
              message: >
                ✓ Skip AI — feels-like {{ context.feels_like_temp }}°F in band, HVAC idle,
                mode {{ states(thermostat) }} matches policy ({{ policy.required_mode }})
          - stop: "Comfort band — policy skip"

  # Step 2: Call Gemini AI
  - service: conversation.process
    data:
      text: |
        You are an expert HVAC optimization system. Analyze conditions and provide ONE specific recommendation.
        
        ZONE: {{ context.zone }}
        MODE: {{ context.mode | upper }}
        
        INDOOR:
        - Dry-bulb: {{ context.indoor_temp }}°F (target: {{ context.thermostat_target }}°F)
        - Feels-like (heat index): {{ context.feels_like_temp }}°F
        {% if context.dew_point_f != "N/A" -%}- Dew point: {{ context.dew_point_f }}°F{% if policy.high_humidity %} (HIGH — prioritize dehumidification/cooling){% endif %}{% endif %}
        {% if context.indoor_humidity != "N/A" -%}- Humidity: {{ context.indoor_humidity }}%{% endif %}
        - Thermostat mode: {{ context.thermostat_mode }} | Allowed: {{ context.supported_hvac_modes }}
        - HVAC action: {{ context.hvac_action }}
        - Zone occupied: {% if context.zone_occupied %}YES{% else %}NO{% endif %}
        
        OUTDOOR:
        {% if context.outdoor_temp != "N/A" -%}- Temperature: {{ context.outdoor_temp }}°F{% endif %}
        {% if context.outdoor_humidity != "N/A" -%}- Humidity: {{ context.outdoor_humidity }}%{% endif %}
        {% if context.weather_condition != "N/A" -%}- Current: {{ context.weather_condition }}{% endif %}
        {% if context.forecast_condition != "N/A" -%}- Forecast: {{ context.forecast_condition }}, high {{ context.forecast_high }}°F{% endif %}
        
        STATUS:
        - Home: {% if context.home_occupied %}OCCUPIED{% else %}UNOCCUPIED{% endif %}
        - ECO Mode: {% if context.eco_mode_active %}ACTIVE{% else %}INACTIVE{% endif %}
        - Doors: {% if context.doors_open %}OPEN{% else %}Closed{% endif %}
        
        ECO RULES:
        {% if context.eco_mode_active -%}
        ⚠️ HOME IS UNOCCUPIED - APPLY ECO SETBACKS:
        - Cooling: Target + {{ context.eco_cooling_value }}°F = {{ context.thermostat_target + context.eco_cooling_value }}°F
        - Heating: Target - {{ context.eco_heating_value }}°F = {{ context.thermostat_target - context.eco_heating_value }}°F
        - PRIORITIZE ENERGY SAVINGS
        {% else -%}
        - Normal mode: optimize for comfort + efficiency
        {% endif %}
        
        RESPONSE FORMAT (EXACT):
        ACTION: [maintain|adjust_temp|change_mode|turn_off]
        TARGET_TEMP: [{{ context.min_allowed }}-{{ context.max_allowed }} or N/A]
        TARGET_MODE: [heat|cool|heat_cool|off or N/A]
        WHY: [One sentence explaining the issue/opportunity]
        HOW: [One sentence explaining the benefit]
        CONFIDENCE: [0-100]
        
        HARD POLICY (templates already computed — do not violate):
        - Profile: {{ zone_policy | upper }}
        - Home occupied (Anyone Home): {% if policy.home_occupied %}YES{% else %}NO{% endif %}
        - Required HVAC mode now: {{ policy.required_mode }} (Ezlo "Auto" = heat_cool)
        - Enforced setpoint range this run: {{ policy.eff_min_temp }}–{{ policy.eff_max_temp }}°F
        - Max change: ±{{ context.max_change_allowed }}°F from current target
        - Occupied: use heat OR cool ONLY (never heat_cool/auto)
        - Unoccupied ECO: heat_cool OK; apply ECO setbacks
        {% if zone_policy == 'living_room' -%}
        LIVING ROOM: Summer outdoor >75°F → cool. Winter <55°F → heat. Forecast high >70°F → cool, <60°F → heat.
        After 11pm: setpoint never below 74°F. Prefer maintain at night unless extreme.
        {% else -%}
        UPSTAIRS: Summer outdoor >65°F → cool. Winter <50°F → heat. Forecast high >65°F → cool, <50°F → heat.
        After 10pm: setpoint never above 71°F. Prefer stable cool for sleep. Daytime unoccupied: 72–74°F.
        Weekend/daytime: if zone occupied in spring/summer/fall, prefer 72°F cooling.
        {% endif -%}
        - Optimal → ACTION: maintain | Doors open → turn_off | Brief answers only
      agent_id: !input ai_agent
    response_variable: ai_response
  
  # Step 3: Parse AI response
  - variables:
      ai_text: "{{ ai_response.response.speech.plain.speech }}"
      parsed:
        action: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'ACTION:' in line %}{{ line.split('ACTION:')[1].strip() }}{% endif %}{% endfor %}
        temp: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'TARGET_TEMP:' in line %}{{ line.split('TARGET_TEMP:')[1].strip().replace('N/A', '70') }}{% endif %}{% endfor %}
        mode: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'TARGET_MODE:' in line %}{{ line.split('TARGET_MODE:')[1].strip().replace('N/A', 'heat_cool') }}{% endif %}{% endfor %}
        why: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'WHY:' in line %}{{ line.split('WHY:')[1].strip() }}{% endif %}{% endfor %}
        how: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'HOW:' in line %}{{ line.split('HOW:')[1].strip() }}{% endif %}{% endfor %}
        confidence: >
          {% set lines = ai_text.split('\n') %}
          {% for line in lines %}{% if 'CONFIDENCE:' in line %}{{ line.split('CONFIDENCE:')[1].strip() }}{% endif %}{% endfor %}

  # Step 3b: Enforce policy on parsed AI output (before any execution)
  - variables:
      safe:
        action: >
          {% if parsed.action not in ['maintain', 'adjust_temp', 'change_mode', 'turn_off'] %}maintain{% else %}{{ parsed.action }}{% endif %}
        mode: >
          {% if policy.eco_active %}heat_cool
          {% elif parsed.action == 'change_mode' and parsed.mode in ['heat', 'cool', 'heat_cool', 'off'] %}{{ parsed.mode if parsed.mode in ['heat', 'cool'] else policy.required_mode }}
          {% elif parsed.action in ['adjust_temp', 'change_mode'] %}{{ policy.required_mode }}
          {% else %}{{ parsed.mode }}{% endif %}
        temp: >
          {% set t = parsed.temp | float(context.thermostat_target) %}
          {% set lo = policy.eff_min_temp | float %}
          {% set hi = policy.eff_max_temp | float %}
          {% set cur = context.thermostat_target | float %}
          {% set max_delta = context.max_change_allowed | float %}
          {% set t = [[t, hi] | min, lo] | max %}
          {% set t = [[t, cur + max_delta] | min, cur - max_delta] | max %}
          {{ t }}
        confidence: "{{ parsed.confidence }}"
        why: "{{ parsed.why }}"
        how: "{{ parsed.how }}"
  
  # Step 4: Log suggestion
  - service: logbook.log
    data:
      name: "AI HVAC ({{ zone_name }})"
      message: >
        {% if safe.action == 'maintain' -%}
        ✓ No changes - conditions optimal
        {% else -%}
        💡 {{ safe.action | upper }}: {{ safe.temp }}°F {{ safe.mode }} | {{ safe.why }} | {{ safe.how }} | Confidence: {{ safe.confidence }}%{% if context.eco_mode_active %} | 🌿 ECO{% endif %}{% if safe.temp != parsed.temp or safe.mode != parsed.mode %} | clamped{% endif %}
        {% endif %}
  
  # Step 5: Handle action based on mode
  - choose:
      # =================================================================
      # MAINTAIN - No action needed
      # =================================================================
      - conditions:
          - condition: template
            value_template: "{{ safe.action == 'maintain' }}"
        sequence: []
      
      # =================================================================
      # MONITORED MODE - Send notification for approval
      # =================================================================
      - conditions:
          - condition: template
            value_template: "{{ automation_mode == 'monitored' and safe.action != 'maintain' }}"
        sequence:
          - service: "{{ notification_service }}"
            data:
              title: "🌡️ AI HVAC ({{ zone_name }})"
              message: >
                {% if safe.action == 'adjust_temp' %}Set to {{ safe.temp }}°F
                {% elif safe.action == 'change_mode' %}Switch to {{ safe.mode }} mode
                {% elif safe.action == 'turn_off' %}Turn off HVAC
                {% else %}{{ safe.action | title }}{% endif %}
                
                Why: {{ safe.why }}
                How: {{ safe.how }}
                {% if context.eco_mode_active %}
                
                🌿 ECO Mode Active{% endif %}
              data:
                actions:
                  - action: "APPROVE_{{ action_id_prefix }}_HVAC"
                    title: "✅ Approve"
                    destructive: false
                  - action: "REJECT_{{ action_id_prefix }}_HVAC"
                    title: "❌ Reject"
                    destructive: true
                  - action: "OVERRIDE_{{ action_id_prefix }}_HVAC"
                    title: "🔧 Override"
                    behavior: "textInput"
                    textInputButtonTitle: "Send"
                    textInputPlaceholder: "e.g., set to 72°F"
                tag: "ai_hvac_{{ action_id_prefix | lower }}"
                push:
                  interruption-level: "active"
          
          # Store pending action data as notification data
          - event: ai_hvac_suggestion_pending
            event_data:
              zone: "{{ zone_name }}"
              action_id: "{{ action_id_prefix }}"
              action_type: "{{ safe.action }}"
              target_temp: "{{ safe.temp }}"
              target_mode: "{{ safe.mode }}"
              reason: "{{ safe.why }} | {{ safe.how }}"
              thermostat: "{{ thermostat }}"
              notification_service: "{{ notification_service }}"
      
      # =================================================================
      # AUTOMATIC MODE - Execute immediately with notification
      # =================================================================
      - conditions:
          - condition: template
            value_template: "{{ automation_mode == 'automatic' and safe.action != 'maintain' }}"
        sequence:
          # Execute the change
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ safe.action == 'adjust_temp' }}"
                sequence:
                  - service: climate.set_temperature
                    target:
                      entity_id: "{{ thermostat }}"
                    data:
                      temperature: "{{ safe.temp | float }}"
              
              - conditions:
                  - condition: template
                    value_template: "{{ safe.action == 'change_mode' }}"
                sequence:
                  - service: climate.set_hvac_mode
                    target:
                      entity_id: "{{ thermostat }}"
                    data:
                      hvac_mode: "{{ safe.mode }}"
              
              - conditions:
                  - condition: template
                    value_template: "{{ safe.action == 'turn_off' }}"
                sequence:
                  - service: climate.turn_off
                    target:
                      entity_id: "{{ thermostat }}"
          
          # Send info notification
          - service: "{{ notification_service }}"
            data:
              title: "✅ AI HVAC Auto-Executed ({{ zone_name }})"
              message: >
                {% if safe.action == 'adjust_temp' %}Set to {{ safe.temp }}°F
                {% elif safe.action == 'change_mode' %}Switched to {{ safe.mode }}
                {% elif safe.action == 'turn_off' %}Turned off HVAC
                {% endif %}
                
                {{ safe.why }}{% if context.eco_mode_active %} | 🌿 ECO{% endif %}
              data:
                tag: "ai_hvac_{{ action_id_prefix | lower }}"
                push:
                  interruption-level: "passive"
          
          # Log execution
          - service: logbook.log
            data:
              name: "AI HVAC ({{ zone_name }})"
              message: "✅ AUTO-EXECUTED: {{ safe.action }} → {{ safe.temp }}°F {{ safe.mode }} — {{ safe.why }}"